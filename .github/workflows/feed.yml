name: Feed semanal

on:
  # Cada subida de código prueba la cocina sola (sin botón ni clics)
  push:
    paths:
      - 'scripts/build-feed.mjs'
      - 'pool_fuentes_50.md'
      - '.github/workflows/feed.yml'
  # Botón manual: pruebas extra con grupo A/B/C/D elegible
  workflow_dispatch:
    inputs:
      grupo:
        description: 'Grupo del pool (vacío = semana actual)'
        required: false
        default: ''
        type: choice
        options: ['', A, B, C, D]
  # Automático: lunes (planning fresco de la semana) + miércoles
  # (cosecha completa tras las publicaciones de programación del martes).
  schedule:
    - cron: '0 6 * * 1,3'

permissions:
  contents: write

jobs:
  check-sources:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Solo prueba de lectura: sin clave, sin Gemini, sin reescribir feeds/.
      - name: Probar fuentes del grupo semanal
        run: node scripts/build-feed.mjs --check-sources

  build-feed:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Generar feed
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          FEED_GROUP: ${{ inputs.grupo }}
        run: node scripts/build-feed.mjs
      - name: Publicar feed
        run: |
          git config user.name "asistente-bot"
          git config user.email "asistente-bot@local"
          # Si la app subió perfil.json durante el run, integrar antes de empujar.
          git pull --rebase --autostash origin main
          git add feeds/feed-latest.json feeds/feed-*.json feeds/last-run.md feeds/fuentes-estado.json
          git diff --cached --quiet || git commit -m "Feed semanal $(date -u +%F) [skip ci]"
          git push
      - name: Subir feed como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: feed
          path: feeds/feed-latest.json
