<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Lámina v3 — iconos full color</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #E9F4F4; font-family: 'Nunito', system-ui, sans-serif; color: #0B3B42;
    display: flex; justify-content: center; }
  .wrap { width: 100%; max-width: 460px; padding: 20px 16px 60px; }
  h1 { font-size: 20px; font-weight: 900; margin: 4px 0 2px; }
  .sub { font-size: 12px; font-weight: 700; color: #5E8B91; margin: 0 0 14px; }
  .sheet { background: #fff; border-radius: 28px 56px 28px 28px;
    box-shadow: 0 10px 28px -8px rgba(11,59,66,.14); padding: 18px 14px; margin-bottom: 16px; }
  .sheet h2 { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em;
    color: #5E8B91; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 4px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cell span { font-size: 10px; font-weight: 900; letter-spacing: .1em; color: #0B3B42; text-transform: uppercase; }
  .foot { text-align: center; font-size: 11px; font-weight: 700; color: #5E8B91; }
</style>
</head>
